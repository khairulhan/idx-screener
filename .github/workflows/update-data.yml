name: Update data saham

on:
  schedule:
    - cron: "47 16 * * 1-5"
      timezone: "Asia/Jakarta"
    - cron: "23 19 * * 1-5"
      timezone: "Asia/Jakarta"
  workflow_dispatch:
    inputs:
      isi_riwayat:
        description: "Isi arsip N hari bursa ke belakang (0 = tidak). Pakai 25 saat pertama kali."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: simpan-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ambil Ringkasan Saham
        run: python scripts/fetch_idx.py --isi-riwayat "${{ github.event.inputs.isi_riwayat || '0' }}"
      - name: Ambil berita (sekalian)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py || echo "berita gagal, lanjut"
      - name: Simpan ke repo
        run: |
          git config user.name "idx-bot"
          git config user.email "idx-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "tidak ada perubahan"; exit 0; }
          git commit -m "data saham $(TZ=Asia/Jakarta date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
