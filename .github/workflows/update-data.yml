name: Update data saham (manual)

# Data BEI harian sekarang diambil oleh tugas terjadwal Claude (lewat browser Claude
# desktop di komputer Anda) sekitar pukul 16:50 WIB dan langsung disimpan ke repo ini.
# Workflow ini hanya untuk dijalankan MANUAL bila perlu: di server GitHub, BEI biasanya
# menolak, sehingga hasilnya memakai Yahoo Finance (tanpa frekuensi & asing).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-saham-cloud
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ambil data (BEI, bila gagal Yahoo)
        run: python scripts/fetch_idx.py
      - name: Ambil berita (sekalian)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py || echo "berita gagal, lanjut"
      - name: Simpan ke repo
        run: |
          git config user.name "idx-bot"
          git config user.email "idx-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "tidak ada perubahan"; exit 0; }
          git commit -m "data saham manual $(TZ=Asia/Jakarta date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
