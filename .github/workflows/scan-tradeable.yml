name: Pindai saham tradeable

# Berjalan otomatis setiap kali data saham baru disimpan ke repo (oleh tugas Claude sore hari),
# plus jadwal cadangan malam hari. Hasil: data/tradeable.json untuk tab "Tradeable" di dashboard.

on:
  push:
    branches: [main]
    paths: ["data/latest.csv"]
  schedule:
    - cron: "47 19 * * 1-5"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-tradeable
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pindai
        run: python scripts/scan_tradeable.py
      - name: Simpan ke repo
        run: |
          git config user.name "idx-bot"
          git config user.email "idx-bot@users.noreply.github.com"
          git add data/tradeable.json data/universe.txt
          git diff --cached --quiet && { echo "tidak ada perubahan"; exit 0; }
          git commit -m "pindai tradeable $(TZ=Asia/Jakarta date '+%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
