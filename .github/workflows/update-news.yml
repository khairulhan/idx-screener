name: Update berita

on:
  schedule:
    - cron: "17 8-14/2 * * 1-5"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simpan-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser
      - name: Ambil berita
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py
      - name: Simpan ke repo
        run: |
          git config user.name "idx-bot"
          git config user.email "idx-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && { echo "tidak ada perubahan"; exit 0; }
          git commit -m "berita $(TZ=Asia/Jakarta date '+%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
